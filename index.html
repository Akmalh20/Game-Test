<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chopstick Dash 2.5D</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#0b1220;
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    user-select:none;-webkit-user-select:none;}
  #game{position:fixed;inset:0;z-index:0;}
  canvas{display:block;}

  /* ---------- GENERIC ---------- */
  .hidden{display:none !important;}
  .screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:18px;overflow-y:auto;}
  .btn{
    border:none;border-radius:16px;padding:14px 26px;font-size:17px;font-weight:800;letter-spacing:.5px;
    cursor:pointer;transition:transform .12s,filter .12s;font-family:inherit;
    background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px);
    border:2px solid rgba(255,255,255,.22);
  }
  .btn:active{transform:scale(.95);}
  .btn.primary{
    background:linear-gradient(180deg,#ffd75e,#f5a623);color:#3a2400;
    border:2px solid #ffe9a8;box-shadow:0 8px 0 #b9741a,0 12px 22px rgba(0,0,0,.4);
  }
  .btn.primary:active{box-shadow:0 4px 0 #b9741a;transform:translateY(4px) scale(.98);}
  .btn.ghost{background:transparent;border:2px dashed rgba(255,255,255,.35);font-size:15px;padding:11px 22px;}

  /* ---------- MENU ---------- */
  #menuScreen{background:radial-gradient(120% 90% at 50% 0%,rgba(20,40,80,.55),rgba(4,8,20,.92));}
  .menu-box{
    width:100%;max-width:430px;background:rgba(12,20,38,.78);
    border:2px solid rgba(255,215,100,.35);border-radius:28px;padding:26px 22px 22px;
    box-shadow:0 26px 60px rgba(0,0,0,.6);backdrop-filter:blur(14px);text-align:center;
    animation:pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .game-title{
    font-size:32px;font-weight:900;letter-spacing:1px;line-height:1.1;
    background:linear-gradient(180deg,#fff3c4,#ffc93c 55%,#f08c00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .game-sub{font-size:13.5px;color:#a9bcdd;margin:10px 0 18px;line-height:1.5;}
  #nameInput{
    width:100%;padding:15px 18px;border-radius:15px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.09);color:#fff;font-size:17px;font-weight:700;text-align:center;
    outline:none;font-family:inherit;margin-bottom:14px;
  }
  #nameInput::placeholder{color:#8fa3c4;font-weight:600;}
  #nameInput:focus{border-color:#ffd75e;background:rgba(255,215,94,.1);}
  .menu-box .btn{width:100%;margin-bottom:10px;}
  .lang-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;
    font-size:13px;color:#8fa3c4;font-weight:700;}
  .lang-btn{border:2px solid rgba(255,255,255,.2);background:transparent;color:#c9d7ee;
    padding:6px 16px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;}
  .lang-btn.active{background:#ffd75e;color:#3a2400;border-color:#ffe9a8;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:12;pointer-events:none;}
  .hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:12px;
    padding:14px 14px 0;padding-top:calc(14px + env(safe-area-inset-top));}
  .hud-pill{
    display:flex;align-items:center;gap:9px;padding:10px 20px;border-radius:16px;
    background:rgba(9,16,32,.75);border:2px solid rgba(255,215,94,.4);
    color:#fff;font-weight:900;font-size:20px;backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(0,0,0,.4);min-width:112px;justify-content:center;
  }
  .hud-pill.warn{border-color:#ff5b5b;color:#ff8f8f;animation:pulse .6s infinite;}
  @keyframes pulse{50%{transform:scale(1.06)}}

  /* ---------- D-PAD ---------- */
  #dpad{
    position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:172px;height:172px;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:6px;z-index:14;pointer-events:auto;
  }
  .dbtn{
    border:2px solid rgba(255,255,255,.28);border-radius:16px;
    background:rgba(14,24,46,.72);color:#dfe9ff;font-size:22px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(6px);transition:background .08s,transform .08s;
    touch-action:none;font-family:inherit;
  }
  .dbtn:active,.dbtn.active{background:rgba(255,215,94,.85);color:#3a2400;transform:scale(.93);}
  .dbtn.up{grid-area:1/2;} .dbtn.left{grid-area:2/1;}
  .dbtn.right{grid-area:2/3;} .dbtn.down{grid-area:3/2;}

  /* ---------- QUESTION MODAL ---------- */
  #questionModal{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(4,8,20,.82);backdrop-filter:blur(5px);padding:16px;
  }
  .q-card{
    width:100%;max-width:520px;background:linear-gradient(180deg,#16233f,#0d1729);
    border:3px solid #ffd75e;border-radius:24px;padding:20px;position:relative;
    box-shadow:0 0 60px rgba(255,215,94,.25),0 24px 50px rgba(0,0,0,.6);
    animation:pop .25s cubic-bezier(.2,1.4,.4,1);
  }
  .q-timer{height:11px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin-bottom:16px;}
  .q-timer-fill{height:100%;width:100%;border-radius:8px;
    background:linear-gradient(90deg,#4ade80,#ffd75e);transition:width .1s linear;}
  .q-timer-fill.danger{background:linear-gradient(90deg,#ff8a3d,#ff3d3d);}
  .q-prompt{color:#ffd75e;font-size:14px;font-weight:800;text-align:center;letter-spacing:.6px;
    text-transform:uppercase;margin-bottom:12px;}
  .q-text{text-align:center;margin-bottom:18px;color:#fff;}
  .bigchar{font-size:56px;font-weight:900;letter-spacing:6px;
    background:linear-gradient(180deg,#fff,#ffd75e);-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:1.2;}
  .bigpinyin{font-size:40px;font-weight:900;color:#8ee5ff;letter-spacing:1px;}
  .bigmeaning{font-size:26px;font-weight:800;color:#b9ffc9;line-height:1.3;}
  .q-options{display:grid;grid-template-columns:1fr;gap:10px;}
  .q-opt{
    padding:15px 16px;border-radius:15px;font-size:19px;font-weight:800;
    background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.2);
    color:#fff;cursor:pointer;font-family:inherit;transition:all .13s;text-align:center;
  }
  .q-opt:active{transform:scale(.97);}
  .q-opt.correct{background:#1f9d55;border-color:#4ade80;color:#fff;animation:pop .25s;}
  .q-opt.wrong{background:#a32020;border-color:#ff6b6b;color:#fff;}
  .q-feedback{text-align:center;font-weight:900;font-size:18px;margin-top:14px;min-height:24px;}
  .q-feedback.ok{color:#4ade80;}
  .q-feedback.bad{color:#ff7b7b;}

  /* ---------- GAME OVER ---------- */
  #overScreen{background:radial-gradient(120% 90% at 50% 0%,rgba(20,40,80,.6),rgba(4,8,20,.95));}
  .over-box{
    width:100%;max-width:430px;background:rgba(12,20,38,.85);border:2px solid rgba(255,215,100,.4);
    border-radius:28px;padding:26px 22px;text-align:center;backdrop-filter:blur(14px);
    box-shadow:0 26px 60px rgba(0,0,0,.65);animation:pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  .over-title{font-size:30px;font-weight:900;color:#ffd75e;letter-spacing:2px;}
  .over-name{font-size:17px;color:#a9bcdd;font-weight:700;margin-top:6px;}
  .score-circle{
    width:180px;height:180px;margin:18px auto;border-radius:50%;
    border:6px solid #ffd75e;background:radial-gradient(circle,rgba(255,215,94,.16),transparent 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-num{font-size:64px;font-weight:900;color:#ffd75e;line-height:1;}
  .score-lbl{font-size:12px;font-weight:800;color:#c9d7ee;letter-spacing:1.5px;margin-top:6px;}
  .over-box .btn{width:100%;margin-bottom:10px;}
  .hint{font-size:12px;color:#7f92b3;margin-top:8px;line-height:1.5;}

  /* ---------- LEADERBOARD ---------- */
  #lbScreen{background:radial-gradient(120% 90% at 50% 0%,rgba(20,40,80,.6),rgba(4,8,20,.95));}
  .lb-box{
    width:100%;max-width:470px;background:rgba(12,20,38,.86);border:2px solid rgba(255,215,100,.4);
    border-radius:26px;padding:22px 18px;backdrop-filter:blur(14px);animation:pop .3s;
  }
  .lb-title{font-size:24px;font-weight:900;color:#ffd75e;text-align:center;letter-spacing:1.5px;margin-bottom:16px;}
  .lb-list{max-height:52vh;overflow-y:auto;margin-bottom:16px;}
  .lb-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;
    padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:8px;}
  .lb-row.top1{background:linear-gradient(90deg,rgba(255,215,94,.28),rgba(255,215,94,.06));border:1px solid rgba(255,215,94,.5);}
  .lb-row.top2{background:linear-gradient(90deg,rgba(200,215,240,.2),rgba(200,215,240,.04));}
  .lb-row.top3{background:linear-gradient(90deg,rgba(205,140,80,.22),rgba(205,140,80,.04));}
  .lb-rank{font-weight:900;color:#ffd75e;font-size:16px;text-align:center;}
  .lb-name{font-weight:800;color:#fff;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-score{font-weight:900;color:#8ee5ff;font-size:17px;}
  .lb-empty{text-align:center;color:#7f92b3;padding:26px 0;font-weight:700;}
  .lb-date{font-size:11px;color:#7f92b3;font-weight:600;}

  /* ---------- HOW TO ---------- */
  #howModal{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
    background:rgba(4,8,20,.85);padding:18px;backdrop-filter:blur(5px);}
  .how-box{max-width:440px;background:#101c33;border:2px solid rgba(255,215,100,.4);
    border-radius:24px;padding:24px;color:#c9d7ee;font-size:14.5px;line-height:1.7;animation:pop .25s;}
  .how-box h3{color:#ffd75e;font-size:20px;margin-bottom:12px;text-align:center;}
  .how-box .btn{width:100%;margin-top:18px;}

  @media (max-width:420px){
    .game-title{font-size:26px;}
    .hud-pill{font-size:17px;padding:8px 15px;min-width:96px;}
    #dpad{width:150px;height:150px;}
    .bigchar{font-size:46px;}
    .bigpinyin{font-size:33px;}
    .q-opt{font-size:17px;padding:13px;}
  }
</style>
</head>
<body>

<div id="game"></div>

<!-- ============ MENU ============ -->
<div id="menuScreen" class="screen">
  <div class="menu-box">
    <h1 class="game-title">🥢 CHOPSTICK DASH</h1>
    <p class="game-sub" id="menuSub">Collect chopsticks · Answer Chinese questions · Beat the clock!</p>
    <input id="nameInput" maxlength="14" placeholder="Enter your name" autocomplete="off">
    <button id="playBtn" class="btn primary">PLAY</button>
    <button id="lbBtn" class="btn">LEADERBOARD</button>
    <button id="howBtn" class="btn ghost">HOW TO PLAY</button>
    <div class="lang-row">
      <span id="langLabel">Language:</span>
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="bm">BM</button>
    </div>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-pill" id="timePill">⏱ <span id="timeVal">2:00</span></div>
    <div class="hud-pill">🥢 <span id="chopVal">0</span></div>
  </div>
  <div id="dpad">
    <button class="dbtn up"    data-dir="up">▲</button>
    <button class="dbtn left"  data-dir="left">◀</button>
    <button class="dbtn right" data-dir="right">▶</button>
    <button class="dbtn down"  data-dir="down">▼</button>
  </div>
</div>

<!-- ============ QUESTION MODAL ============ -->
<div id="questionModal" class="hidden">
  <div class="q-card">
    <div class="q-timer"><div class="q-timer-fill" id="qTimerFill"></div></div>
    <div class="q-prompt" id="qPrompt"></div>
    <div class="q-text" id="qText"></div>
    <div class="q-options" id="qOptions"></div>
    <div class="q-feedback" id="qFeedback"></div>
  </div>
</div>

<!-- ============ GAME OVER ============ -->
<div id="overScreen" class="screen hidden">
  <div class="over-box">
    <div class="over-title" id="overTitle">GAME OVER</div>
    <div class="over-name" id="overName">—</div>
    <div class="score-circle">
      <div class="score-num" id="finalScore">0</div>
      <div class="score-lbl" id="scoreLbl">CHOPSTICKS</div>
    </div>
    <button id="saveBtn" class="btn primary">SAVE SCORE IMAGE</button>
    <button id="againBtn" class="btn">PLAY AGAIN</button>
    <button id="overLbBtn" class="btn ghost">LEADERBOARD</button>
    <div class="hint" id="saveHint"></:'div>
  </div>
</div>

<!-- ============ LEADERDBOARD ============ -->
<div id="lbScreen" class="screen hidden">
  <div class="lb-box">
    <div class="lb-title" id="lbTitle">🏆 LEADERBOARD</div>
    <div class="lb-list" id="lbList"></div>
    <button id="lbBack" class="btn primary">BACK</button>
  </div>
</div>

<!-- ============ HOW TO ============ -->
<div id="howModal" class="hidden">
  <div class="how-box">
    <h3 id="howTitle">How to Play</h3>
    <div id="howText"></div>
    <button id="howClose" class="btn primary">OK</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   1. LANGUAGE / TEXT
   ========================================================= */
const I18N = {
  en: {
    title:'CHOPSTICK DASH',
    sub:'Collect chopsticks · Answer Chinese questions · Beat the clock!',
    namePh:'Enter your name',
    play:'PLAY', leaderboard:'LEADERBOARD', howto:'HOW TO PLAY',
    howTitle:'How to Play',
    howText:`<b>1.</b> Move with the D-Pad on screen (or arrow keys / WASD).<br>
             <b>2.</b> Touch a golden 🥢 chopstick to trigger a Chinese question.<br>
             <b>3.</b> You have <b>15 seconds</b> to answer each question.<br>
             <b>4.</b> Correct answer = +1 chopstick.<br>
             <b>5.</b> Collect as many chopsticks as you can in <b>2 minutes</b>!`,
    langLabel:'Language:',
    back:'BACK', playAgain:'PLAY AGAIN', saveScore:'SAVE SCORE IMAGE',
    gameOver:'GAME OVER', scoreLbl:'CHOPSTICKS COLLECTED',
    yourScore:'Your Score', noScores:'No scores yet. Be the first!',
    enterName:'Please enter your name first!',
    correct:'CORRECT!  +1 Chopstick 🥢', wrong:'WRONG ANSWER!', timeout:"TIME'S UP!",
    rank:'#', player:'Player', score:'Score',
    saved:'Score image downloaded ✔', saveHint:'Tip: this JPEG is your proof of participation.',
    q1:'Choose the correct PINYIN', q2:'Choose the correct CHARACTER',
    q3:'Choose the CHARACTER for this meaning', q4:'Choose the MEANING of this pinyin',
    timeUp:'TIME UP!'
  },
  bm: {
    title:'CHOPSTICK DASH',
    sub:'Kumpul chopstick · Jawab soalan Bahasa Cina · Lawan masa!',
    namePh:'Taip nama anda',
    play:'MAIN', leaderboard:'PAPAN SKOR', howto:'CARA BERMAIN',
    howTitle:'Cara Bermain',
    howText:`<b>1.</b> Gerak guna D-Pad (atau kekunci anak panah / WASD).<br>
             <b>2.</b> Sentuh 🥢 chopstick emas untuk dapatkan soalan Cina.<br>
             <b>3.</b> Anda ada <b>15 saat</b> untuk jawab setiap soalan.<br>
             <b>4.</b> Jawapan betul = +1 chopstick.<br>
             <b>5.</b> Kumpul sebanyak mungkin dalam <b>2 minit</b>!`,
    langLabel:'Bahasa:',
    back:'KEMBALI', playAgain:'MAIN LAGI', saveScore:'SIMPAN GAMBAR MARKAH',
    gameOver:'TAMAT PERMAINAN', scoreLbl:'CHOPSTICK DIKUMPUL',
    yourScore:'Markah Anda', noScores:'Belum ada markah. Jadilah yang pertama!',
    enterName:'Sila masukkan nama anda dahulu!',
    correct:'BETUL!  +1 Chopstick 🥢', wrong:'JAWAPAN SALAH!', timeout:'MASA TAMAT!',
    rank:'#', player:'Pemain', score:'Markah',
    saved:'Gambar markah telah dimuat turun ✔', saveHint:'Tip: JPEG ini bukti penyertaan anda.',
    q1:'Pilih PINYIN yang betul', q2:'Pilih KARAKTER yang betul',
    q3:'Pilih KARAKTER bagi maksud ini', q4:'Pilih MAKSUD bagi pinyin ini',
    timeUp:'MASA TAMAT!'
  }
};

/* =========================================================
   2. GAME DATA — Chinese vocabulary
   ========================================================= */
const WORDS = [
  { char:'看电视', pinyin:'kàn diànshì', en:'Watch TV',        bm:'Tonton TV' },
  { char:'看书',   pinyin:'kàn shū',     en:'Read a book',     bm:'Baca buku' },
  { char:'吃饭',   pinyin:'chīfàn',      en:'Eat a meal',      bm:'Makan' },
  { char:'跑步',   pinyin:'pǎobù',       en:'Run / Jog',       bm:'Berlari' },
  { char:'听音乐', pinyin:'tīng yīnyuè', en:'Listen to music', bmengar muzik' },
  { char:'画画',   pinyin:'huàhuà',      en:'Draw / Paint',    bm:'Melukis' },
  { char:'写字',   pinyin:'xiězì',       en:'Write characters',bm:'Menulis' }
];

/* =========================================================
   3. GAME STATE
   ========================================================= */
const state = {
  screen:'menu',
  lang:'en',
  playerName:'',
  chopsticks:0,
  timeLeft:120,
  questionActive:false,
  qLocked:false,
  qTimeLeft:15,
  q:null,
  scoreSavedThisRound:false
};

const GAME_TIME = 120;      // 2 minutes
const Q_TIME    = 15;       // 15 seconds per question
const PLAYER_SPEED = 7.2;
const WORLD_LIMIT  = 16.5;
const PROP_COUNT   = 12;

/* =========================================================
   4. THREE.JS SETUP
   ========================================================= */
let renderer, scene, camera, clock;
let playerObj, playerRoot, bodyGroup, armL, armR, legL, legR;
const props = [];
let walkPhase = 0;
let idleTime = 0;

const keys = { up:false, down:false, left:false, right:false };

function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('game').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ec9f0);
  scene.fog = new THREE.Fog(0x8ec9f0, 34, 72);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 300);
  camera.position.set(0, 8.5, 11);
  camera.lookAt(0, 1.4, 0);

  /* ---- Lights ---- */
  const hemi = new THREE.HemisphereLight(0xffffff, 0x5d8a4a, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff3d0, 1.8);
  sun.position.set(14, 24, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -26;
  sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 26;
  sun.shadow.camera.bottom = -26;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 70;
  sun.shadow.bias = -0.0008;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x99ccff, 0.35);
  fill.position.set(-10, 8, -12);
  scene.add(fill);

  buildWorld();
  buildPlayer();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}

/* =========================================================
   5. WORLD BUILDING
   ========================================================= */
function makeGrassTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#67b455'; x.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){
    const r = Math.random();
    x.fillStyle = r>0.66 ? 'rgba(86,158,68,0.65)'
                : r>0.33 ? 'rgba(128,205,102,0.55)'
                         : 'rgba(150,220,120,0.35)';
    x.fillRect(Math.random()*256, Math.random()*256, 2+Math.random()*3, 2+Math.random()*3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(16,16);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildWorld(){
  /* Ground */
  const groundGeo = new THREE.PlaneGeometry(90, 90);
  const groundMat = new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness:0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  /* Dirt path circle */
  const pathMat = new THREE.MeshStandardMaterial({ color:0xc9a877, roughness:1 });
  const path = new THREE.Mesh(new THREE.CircleGeometry(6.5, 48), pathMat);
  path.rotation.x = -Math.PI/2;
  path.position.y = 0.01;
  path.receiveShadow = true;
  scene.add(path);

  /* Trees around border */
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x6b4a2b, roughness:1 });
  const leafMats = [
    new THREE.MeshStandardMaterial({ color:0x3f8f3f, roughness:0.95 }),
    new THREE.MeshStandardMaterial({ color:0x4fa84f, roughness:0.95 }),
    new THREE.MeshStandardMaterial({ color:0x357a35, roughness:0.95 })
  ];
  for(let i=0;i<34;i++){
    const ang = (i/34) * Math.PI * 2 + Math.random()*0.15;
    const rad = 20 + Math.random()*9;
    const x = Math.cos(ang)*rad;
    const z = Math.sin(ang)*rad;
    const tree = new THREE.Group();
    const scale = 0.85 + Math.random()*0.6;

    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.32,1.8,8), trunkMat);
    trunk.position.y = 0.9;
    trunk.castShadow = true;
    tree.add(trunk);

    const lm = leafMats[Math.floor(Math.random()*leafMats.length)];
    for(let k=0;k<3;k++){
      const blob = new THREE.Mesh(new THREE.SphereGeometry(0.95 - k*0.16, 12, 10), lm);
      blob.position.set((Math.random()-0.5)*0.6, 2.0 + k*0.62, (Math.random()-0.5)*0.6);
      blob.castShadow = true;
      tree.add(blob);
    }
    tree.position.set(x, 0, z);
    tree.scale.setScalar(scale);
    tree.rotation.y = Math.random()*Math.PI*2;
    scene.add(tree);
  }

  /* Clouds */
  const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.92 });
  for(let i=0;i<10;i++){
    const g = new THREE.Group();
    for(let k=0;k<4;k++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(1.6 + Math.random()*1.1, 10, 8), cloudMat);
      s.position.set((k-1.5)*1.8 + Math.random(), Math.random()*0.6, Math.random()*0.8);
      g.add(s);
    }
    g.position.set((Math.random()-0.5)*70, 14 + Math.random()*7, -22 - Math.random()*30);
    scene.add(g);
  }

  /* Fence posts (soft world border hint) */
  const postMat = new THREE.MeshStandardMaterial({ color:0x9a6b3f, roughness:1 });
  for(let i=0;i<48;i++){
    const ang = (i/48)*Math.PI*2;
    const x = Math.cos(ang)*18.2, z = Math.sin(ang)*18.2;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.8,0.18), postMat);
    post.position.set(x, 0.4, z);
    post.castShadow = true;
    scene.add(post);
  }
}

  const earR = new THREE.Mesh(earGeo, skinMat); earR.position.set( 0.252, 1.875, 0.01); earR.scale.set(0.5,1,0.75);

function createChopstickMesh(){
  const g = new THREE.Group();

  const woodMat = new THREE.MeshStandardMaterial({
    color:0xffc94d, metalness:0.55, roughness:0.28,
    emissive:0x8a5b00, emissiveIntensity:0.75
  });
  const geo = new THREE.CylinderGeometry(0.042, 0.020, 1.05, 10);
  const s1 = new THREE.Mesh(geo, woodMat); s1.rotation.z =  0.20; s1.position.x = -0.085;
  const s2 = new THREE.Mesh(geo, woodMat); s2.rotation.z = -0.20; s2.position.x =  0.085;
  s1.castShadow = true; s2.castShadow = true;
  g.add(s1, s2);

  /* Glow ring */
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.52, 0.035, 8, 32),
    new THREE.MeshBasicMaterial({ color:0xffe27a, transparent:true, opacity:0.65 })
  );
  ring.rotation.x = Math.PI/2;
  ring.position.y = -0.5;
  g.add(ring);

  /* Sparkle */
  const spark = new THREE.Mesh(

  );

function randomPropPosition(){
  for(let attempt=0; attempt<40; attempt++){
    const x = (Math.random()-0.5) * 30;
    const z = (Math.random()-0.5) * 30;
    if(Math.hypot(x - playerRoot.position.x, z - playerRoot.position.z) < 4.5) continue;
    let ok = true;
    for(const p of props){
      if(Math.hypot(x - p.position.x, z - p.position.z) < 3.2){ ok = false; break; }
    }
    if(ok) return new THREE.Vector3(x, 0, z);
  }
  return new THREE.Vector3((Math.random()-0.5)*28, 0, (Math.random()-0.5)*28);
}

function spawnProp(){
  const mesh = createChopstickMesh();
  const pos = randomPropPosition();
  mesh.position.set(pos.x, 1.05, pos.z);
  mesh.userData.baseY = 1.05;
  mesh.userData.phase = Math.random() * Math.PI * 2;
  mesh.userData.ring.rotation.z = Math.random()*Math.PI;
  scene.add(mesh);
  props.push(mesh);
}

function clearProps(){
  props.forEach(p => scene.remove(p));
  props.length = 0;
}

/* =========================================================
   8. QUESTION GENERATOR
   ========================================================= */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function makeQuestion(){
  const type = Math.floor(Math.random()*4) + 1;     // 1..4
  const answer = WORDS[Math.floor(Math.random()*WORDS.length)];
  const pool = shuffle(WORDS.filter(w => w !== answer)).slice(0,3);

  let promptKey, promptHTML, correctText, getText;

  if(type === 1){
    // Show CHARACTER -> choose PINYIN
    promptKey = 'q1';
    promptHTML = `<div class="bigchar">${answer.char}</div>`;
    correctText = answer.pinyin;
    getText = w => w.pinyin;
  } else if(type === 2){
    // Show PINYIN -> choose CHARACTER
    promptKey = 'q2';
    promptHTML = `<div class="bigpinyin">${answer.pinyin}</div>`;
    correctText = answer.char;
    getText = w => w.char;
  } else if(type === 3){
    // Show MEANING -> choose CHARACTER
    promptKey = 'q3';
    promptHTML = `<div class="bigmeaning">${answer[state.lang]}</div>`;
    correctText = answer.char;
    getText = w => w.char;
  } else {
    // Show PINYIN -> choose MEANING
    promptKey = 'q4';
    promptHTML = `<div class="bigpinyin">${answer.pinyin}</div>`;
    correctText = answer[state.lang];
    getText = w => w[state.lang];
  }

  const options = shuffle([
    { text: correctText, correct: true },
    ...pool.map(w => ({ text: getText(w), correct: false }))
  ]);

  const correctIndex = options.findIndex(o => o.correct);

  return {
    type, promptKey, promptHTML,
    options: options.map(o => o.text),
    correctIndex
  };
}

  $('lbScreen').classList.toggle('hidden', name !== 'lb');
  $('hud').classList.toggle('hidden', name !== 'playing');

}

function startGame(){
  const name = $('nameInput').value.trim();
  if(!name){
    $('nameInput').focus();
    $('nameInput').style.borderColor = '#ff5b5b';
    $('nameInput').placeholder = t('enterName');
    setTimeout(()=>{ $('nameInput').style.borderColor = ''; }, 1500);
    return;
  }
  state.playerName = name.slice(0,14);
  state.chopsticks = 0;
  state.timeLeft   = GAME_TIME;
  state.questionActive = false;
  state.qLocked = false;
  state.scoreSavedThisRound = false;

  // reset player
  playerRoot.position.set(0, 0, 0);
  playerRoot.rotation.y = 0;
  bodyGroup.position.y = 0;
  walkPhase = 0;

  // reset props
  clearProps();
  for(let i=0;i<PROP_COUNT;i++) spawnProp();

  // reset camera
  camera.position.set(0, 8.5, 11);
  camera.lookAt(0, 1.4, 0);

  updateHUD();
  $('questionModal').classList.add('hidden');
  showScreen('playing');
}

function updateHUD(){
  const m = Math.floor(state.timeLeft / 60);
  const s = Math.floor(state.timeLeft % 60);
  $('timeVal').textContent = `${m}:${String(s).padStart(2,'0')}`;
  $('chopVal').textContent = state.chopsticks;
  $('timePill').classList.toggle('warn', state.timeLeft <= 15);
}

function endGame(){
  if(state.screen === 'over') return;
  state.questionActive = false;
  $('questionModal').classList.add('hidden');

  $('overName').textContent = state.playerName;
  $('finalScore').textContent = state.chopsticks;
  $('saveHint').textContent = t('saveHint');

  saveToLeaderboard(state.playerName, state.chopsticks);
  showScreen('over');
}

/* =========================================================
   10. QUESTION UI
   ========================================================= */
function openQuestion(){
  if(state.questionActive || state.screen !== 'playing') return;
  state.questionActive = true;
  state.qLocked = false;
  state.qTimeLeft = Q_TIME;

  const q = makeQuestion();
  state.q = q;

  $('qPrompt').textContent = t(q.promptKey);
  $('qText').innerHTML = q.promptHTML;

  const box = $('qOptions');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = opt;
    b.addEventListener('click', () => answerQuestion(i, b));
    box.appendChild(b);
  });

  const fb = $('qFeedback');
  fb.textContent = '';
  fb.className = 'q-feedback';

  const fill = $('qTimerFill');
  fill.style.width = '100%';
  fill.classList.remove('danger');

  $('questionModal').classList.remove('hidden');
}

function answerQuestion(idx, btn){
  if(!state.questionActive || state.qLocked) return;
  state.qLocked = true;

  const correct = idx === state.q.correctIndex;
  const btns = [...document.querySelectorAll('.q-opt')];
  btns.forEach((b, i) => { if(i === state.q.correctIndex) b.classList.add('correct'); });

  const fb = $('qFeedback');

  if(correct){
    state.chopsticks++;
    updateHUD();
    fb.textContent = t('correct');
    fb.className = 'q-feedback ok';
    // little jump feedback
    bodyGroup.position.y = 0.25;
  } else {
    if(btn) btn.classList.add('wrong');
    fb.textContent = t('wrong');
    fb.className = 'q-feedback bad';
  }

  setTimeout(closeQuestion, 1150);
}

function closeQuestion(){
  state.questionActive = false;
  state.qLocked = false;
  $('questionModal').classList.add('hidden');
}

/* =========================================================
   11. UPDATE LOOP
   ========================================================= */
function updateGame(dt){
  /* ---- timer ---- */
  if(state.screen === 'playing' && !state.questionActive){
    state.timeLeft -= dt;
    if(state.timeLeft <= 0){
      state.timeLeft = 0;
      updateHUD();
      endGame();
      return;
    }
    updateHUD();
  } else if(state.screen === 'playing' && state.questionActive){
    // question countdown
    if(!state.qLocked){
      state.qTimeLeft -= dt;
      const pct = Math.max(0, state.qTimeLeft / Q_TIME);
      const fill = $('qTimerFill');
      fill.style.width = (pct * 100) + '%';
      fill.classList.toggle('danger', pct < 0.4);

      if(state.qTimeLeft <= 0){
        state.qLocked = true;
        const btns = [...document.querySelectorAll('.q-opt')];
        btns.forEach((b,i) => { if(i === state.q.correctIndex) b.classList.add('correct'); });
        const fb = $('qFeedback');
        fb.textContent = t('timeout');
        fb.className = 'q-feedback bad';
        setTimeout(closeQuestion, 1150);
      }
    }
  }

  /* ---- movement ---- */
  let mx = 0, mz = 0;
  if(state.screen === 'playing' && !state.questionActive){
    if(keys.up)    mz -= 1;
    if(keys.down)  mz += 1;
    if(keys.left)  mx -= 1;
    if(keys.right) mx += 1;
  }

  const moving = (mx !== 0 || mz !== 0);
  const len = Math.hypot(mx, mz) || 1;
  mx /= len; mz /= len;

  if(moving){
    playerRoot.position.x += mx * PLAYER_SPEED * dt;
    playerRoot.position.z += mz * PLAYER_SPEED * dt;

    // clamp to world
    playerRoot.position.x = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, playerRoot.position.x));
    playerRoot.position.z = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, playerRoot.position.z));

    // face movement direction (model faces +Z)
    const targetY = Math.atan2(mx, mz);
    let diff = targetY - playerRoot.rotation.y;
    while(diff >  Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    playerRoot.rotation.y += diff * Math.min(1, dt * 14);
  }

  /* ---- limb animation ---- */
  if(moving){
    walkPhase += dt * 11.5;
    const s = Math.sin(walkPhase);
    const c = Math.cos(walkPhase);

    legL.rotation.x =  s * 0.85;
    legR.rotation.x = -s * 0.85;
    legL.rotation.z =  c * 0.05;
    legR.rotation.z = -c * 0.05;

    armL.rotation.x = -s * 0.72;
    armR.rotation.x =  s * 0.72;
    armL.rotation.z =  0.10 + c * 0.05;
    armR.rotation.z = -0.10 - c * 0.05;

    bodyGroup.position.y = Math.abs(Math.sin(walkPhase)) * 0.075;
    bodyGroup.rotation.z = Math.sin(walkPhase) * 0.035;
    bodyGroup.rotation.y = -Math.sin(walkPhase) * 0.06;

  } else {
    // ease back to idle
    const k = Math.min(1, dt * 9);
    legL.rotation.x += (0 - legL.rotation.x) * k;
    legR.rotation.x += (0 - legR.rotation.x) * k;
    armL.rotation.x += (0 - armL.rotation.x) * k;
    armR.rotation.x += (0 - armR.rotation.x) * k;
    legL.rotation.z += (0 - legL.rotation.z) * k;
    legR.rotation.z += (0 - legR.rotation.z) * k;
    armL.rotation.z += (0.10 - armL.rotation.z) * k;
    armR.rotation.z += (-0.10 - armR.rotation.z) * k;
    bodyGroup.rotation.z += (0 - bodyGroup.rotation.z) * k;
    bodyGroup.rotation.y += (0 - bodyGroup.rotation.y) * k;

    idleTime += dt;
    const breathe = Math.sin(idleTime * 2.1) * 0.018;
    bodyGroup.position.y += (breathe - bodyGroup.position.y) * k * 0.6;
  }

  /* ---- props float & spin ---- */
  const time = performance.now() * 0.001;
  for(const p of props){
    p.rotation.y += dt * 1.5;
    p.position.y = p.userData.baseY + Math.sin(time * 2.2 + p.userData.phase) * 0.16;
    p.userData.ring.rotation.z += dt * 0.9;
    const sc = 1 + Math.sin(time * 3 + p.userData.phase) * 0.12;
    p.userData.spark.scale.setScalar(sc);
  }

  /* ---- collection detection ---- */
  if(state.screen === 'playing' && !state.questionActive){
    for(let i = props.length - 1; i >= 0; i--){
      const p = props[i];
      const dx = p.position.x - playerRoot.position.x;
      const dz = p.position.z - playerRoot.position.z;
      if(dx*dx + dz*dz < 1.75){
        scene.remove(p);
        props.splice(i, 1);
        spawnProp();
        openQuestion();
        break;
      }
    }
  }

  /* ---- camera follow ---- */
  const camTX = playerRoot.position.x;
  const camTZ = playerRoot.position.z;
  camera.position.x += (camTX - camera.position.x) * Math.min(1, dt * 5);
  camera.position.z += ((camTZ + 10.5) - camera.position.z) * Math.min(1, dt * 5);
  camera.position.y += (8.6 - camera.position.y) * Math.min(1, dt * 5);
  camera.lookAt(camTX, 1.5, camTZ);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateGame(dt);
  renderer.render(scene, camera);
}

/* =========================================================
   12. LEADERBOARD (localStorage + cross-tab sync)
   ========================================================= */
const LB_KEY = 'chopstickDashLeaderboard_v1';
let bc = null;
try { bc = new BroadcastChannel('chopstickDash'); } catch(e){ bc = null; }

function getLeaderboard(){
  try {
    const raw = localStorage.getItem(LB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}

function saveToLeaderboard(name, score){
  const lb = getLeaderboard();
  lb.push({ name, score, ts: Date.now() });
  lb.sort((a,b) => b.score - a.score || a.ts - b.ts);
  const trimmed = lb.slice(0, 60);
  try { localStorage.setItem(LB_KEY, JSON.stringify(trimmed)); } catch(e){}
  if(bc) { try { bc.postMessage({ type:'lb-updated' }); } catch(e){} }
}

function renderLeaderboard(){
  const list = $('lbList');
  const lb = getLeaderboard();
  if(lb.length === 0){
    list.innerHTML = `<div class="lb-empty">${t('noScores')}</div>`;
    return;
  }
  list.innerHTML = lb.map((row, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
    const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const d = new Date(row.ts);
    const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="lb-row ${cls}">
      <div class="lb-rank">${medal}</div>
      <div>
        <div class="lb-name">${escapeHtml(row.name)}</div>
        <div class="lb-date">${dateStr}</div>
      </div>
      <div class="lb-score">🥢 ${row.score}</div>
    </div>`;
  }).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[m]);
}

/* =========================================================
   13. SAVE SCORE AS JPEG
   ========================================================= */
function saveScoreImage(){
  const name  = state.playerName || 'Player';
  const score = state.chopsticks;
  const W = 900, H = 1120;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Background gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#16233f');
  g.addColorStop(0.5, '#0f1a2e');
  g.addColorStop(1, '#070d18');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Radial glow behind score
  const rg = ctx.createRadialGradient(W/2, 640, 40, W/2, 640, 380);
  rg.addColorStop(0, 'rgba(255,215,94,0.16)');
  rg.addColorStop(1, 'rgba(255,215,94,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 250, W, 800);

  // Decorative sparkles
  for(let i=0;i<40;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const r = Math.random()*2.2 + 0.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.05 + Math.random()*0.18})`;
    ctx.fill();
  }

  // Border frame
  ctx.strokeStyle = '#ffd75e';
  ctx.lineWidth = 8;
  roundRect(ctx, 24, 24, W-48, H-48, 30);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,215,94,0.35)';
  ctx.lineWidth = 2;
  roundRect(ctx, 42, 42, W-84, H-84, 22);
  ctx.stroke();

  // Header
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#ffd75e';
  ctx.font = 'bold 58px "Segoe UI", Arial, sans-serif';
  ctx.fillText('🥢 CHOPSTICK DASH', W/2, 168);

  ctx.fillStyle = '#8fa8cf';
  ctx.font = '600 26px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Chinese Learning Game  ·  华文学习游戏', W/2, 214);

  // Divider
  ctx.beginPath();
  ctx.moveTo(W/2 - 200, 254);
  ctx.lineTo(W/2 + 200, 254);
  ctx.strokeStyle = 'rgba(255,215,94,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Player label + name
  ctx.fillStyle = '#8fa8cf';
  ctx.font = '700 24px "Segoe UI", Arial, sans-serif';
  ctx.fillText('PLAYER', W/2, 340);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 54px "Segoe UI", Arial, sans-serif';
  ctx.fillText(fitText(ctx, name, W - 200, 'bold 54px "Segoe UI", Arial, sans-serif'), W/2, 402);

  // Score ring
  const cx = W/2, cy = 640, R = 168;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,215,94,0.08)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = '#ffd75e';
  ctx.lineWidth = 8;
  ctx.stroke();

  // Score number
  ctx.fillStyle = '#ffd75e';
  ctx.font = 'bold 158px "Segoe UI", Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(score), cx, cy + 8);
  ctx.textBaseline = 'alphabetic';

  // Score label
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px "Segoe UI", Arial, sans-serif';
  ctx.fillText('CHOPSTICKS COLLECTED', W/2, 872);

  ctx.fillStyle = '#8fa8cf';
  ctx.font = '600 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText('dalam 2 minit  ·  within 2 minutes', W/2, 908);

  // Date box
  const d = new Date();
  const dateStr = d.toLocaleString('en-GB', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });

  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(ctx, W/2 - 230, 950, 460, 62, 16);
  ctx.fill();

  ctx.fillStyle = '#c9d7ee';
  ctx.font = '600 24px "Segoe UI", Arial, sans-serif';
  ctx.fillText(dateStr, W/2, 990);

  // Footer
  ctx.fillStyle = '#5f7398';
  ctx.font = '600 19px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Proof of completion · Keep learning Chinese!', W/2, 1058);

  // Export
  const url = c.toDataURL('image/jpeg', 0.93);
  const safeName = (name.replace(/[^a-z0-9]/gi, '_') || 'Player');
  const a = document.createElement('a');
  a.href = url;
  a.download = `ChopstickDash_${safeName}_${score}chopsticks.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();

  $('saveHint').textContent = t('saved');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fitText(ctx, text, maxWidth, font){
  ctx.font = font;
  if(ctx.measureText(text).width <= maxWidth) return text;
  let out = text;
  while(out.length > 1 && ctx.measureText(out + '…').width > maxWidth){
    out = out.slice(0, -1);
  }
  return out + '…';
}

/* =========================================================
   14. INPUT HANDLING
   ========================================================= */
function setupInput(){
  // D-pad buttons
  document.querySelectorAll('.dbtn').forEach(btn => {
    const dir = btn.dataset.dir;
    const press = e => {
      e.preventDefault();
      keys[dir] = true;
      btn.classList.add('active');
      if(btn.setPointerCapture && e.pointerId !== undefined){
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
      }
    };
    const release = e => {
      e.preventDefault();
      keys[dir] = false;
      btn.classList.remove('active');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // Keyboard
  const keyMap = {
    'ArrowUp':'up', 'ArrowDown':'down', 'ArrowLeft':'left', 'ArrowRight':'right',
    'w':'up', 's':'down', 'a':'left', 'd':'right',
    'W':'up', 'S':'down', 'A':'left', 'D':'right'
  };
  window.addEventListener('keydown', e => {
    const k = keyMap[e.key];
    if(k){
      keys[k] = true;
      e.preventDefault();
    }
    // Number keys 1-4 for answering
    if(state.questionActive && !state.qLocked && ['1','2','3','4'].includes(e.key)){
      const idx = parseInt(e.key, 10) - 1;
      const btns = [...document.querySelectorAll('.q-opt')];
      if(btns[idx]) answerQuestion(idx, btns[idx]);
    }
  });
  window.addEventListener('keyup', e => {
    const k = keyMap[e.key];
    if(k){
      keys[k] = false;
      e.preventDefault();
    }
  });

  // Prevent scroll / zoom gestures on the game area
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1) e.preventDefault();
  }, { passive:false });
}

/* =========================================================
   15. UI WIRING
   ========================================================= */
function setupUI(){
  $('playBtn').addEventListener('click', startGame);

  $('nameInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') startGame();
  });

  $('lbBtn').addEventListener('click', () => {
    renderLeaderboard();
    showScreen('lb');
  });
  $('overLbBtn').addEventListener('click', () => {
    renderLeaderboard();
    showScreen('lb');
  });
  $('lbBack').addEventListener('click', () => {
    showScreen(state.playerName && state.screen === 'lb' && state.timeLeft <= 0 ? 'over' : 'menu');
    // simple: if game was finished, go back to over screen, else menu
  });

  // Fix back button behaviour properly
  $('lbBack').onclick = () => {
    if($('overScreen').classList.contains('hidden') === false){
      showScreen('over');
    } else {
      showScreen('menu');
    }
  };

  $('howBtn').addEventListener('click', () => $('howModal').classList.remove('hidden'));
  $('howClose').addEventListener('click', () => $('howModal').classList.add('hidden'));

  $('againBtn').addEventListener('click', () => {
    state.timeLeft = GAME_TIME;
    startGame();
  });

  $('saveBtn').addEventListener('click', saveScoreImage);

  // Language buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.lang = btn.dataset.lang;
      applyLanguage();
      if(!$('lbScreen').classList.contains('hidden')) renderLeaderboard();
    });
  });

  // Cross-tab leaderboard sync
  if(bc){
    bc.onmessage = () => {
      if(!$('lbScreen').classList.contains('hidden')) renderLeaderboard();
    };
  }
  window.addEventListener('storage', e => {
    if(e.key === LB_KEY && !$('lbScreen').classList.contains('hidden')) renderLeaderboard();
  });
}

/* =========================================================
   16. BOOT
   ========================================================= */
function boot(){
  applyLanguage();
  setupUI();
  setupInput();
  initThree();

  // Try to remember last player name
  try {
    const last = localStorage.getItem('chopstickDashLastName');
    if(last) $('nameInput').value = last;
  } catch(e){}

  $('nameInput').addEventListener('change', () => {
    try { localStorage.setItem('chopstickDashLastName', $('nameInput').value.trim()); } catch(e){}
  });

  showScreen('menu');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
